career-profile:
  title: Perfil Profesional
  summary: |
    Desarrollador de software con experiencia en automatización de procesos, desarrollo web y visualización de datos. Especializado en diseñar soluciones tecnológicas que optimizan la productividad y mejoran flujos de trabajo. Me destaco por mi capacidad de análisis, atención al detalle y enfoque en la creación de herramientas eficientes, confiables y personalizadas, impulsando la transformación digital y el éxito operativo.

