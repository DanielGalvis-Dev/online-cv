experiences:
  - role: Analista Desarrollador de Software
    time: 2023 - 2024
    company: CENTRO NACIONAL COLOMBO ALEMAN
    details: |
      -	Desarrollé una plataforma de monitoreo que integraba datos en tiempo real desde sensores, aplicando principios de disponibilidad y eficiencia en consultas.
      -	Optimicé bases de datos relacionales (MySQL) mejorando un 30% el rendimiento de consultas en entornos con alta concurrencia.
      -	Diseñé e implementé integraciones con terceros mediante APIs REST y procesamiento de archivos para visualización de datos de sensores.
      -	Diseñé un sistema de alertas que redujo un 40% el tiempo de respuesta a fallos técnicos.
      -	Introduje Git/GitHub para control de versiones, reduciendo un 20% errores en producción.


